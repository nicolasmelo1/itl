name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Enable pnpm
        run: corepack enable
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: uv --directory apps/ai sync --locked
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Enable pnpm
        run: corepack enable
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile && uv --directory apps/ai sync --locked
      - name: JavaScript dependency vulnerabilities
        run: pnpm audit --audit-level=high
      - name: Python dependency vulnerabilities
        run: uv --directory apps/ai run --with pip-audit pip-audit
      - name: Python insecure patterns
        run: uv --directory apps/ai run --with bandit bandit -r src -x ../../.software-factory
      - name: TypeScript insecure patterns
        run: pnpm dlx semgrep --config auto --error --exclude .software-factory
      - name: Committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
      - name: Insecure workflows
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/workflows/
          advanced-security: false
          annotations: true
